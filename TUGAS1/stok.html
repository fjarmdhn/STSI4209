<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Informasi Stok Bahan Ajar - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar">
        <h3>SITTA UT</h3>
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="stok.html">Informasi Bahan Ajar</a>
            <a href="tracking.html">Tracking Pengiriman</a>
            <a href="index.html">Keluar</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>Tambah Stok Bahan Ajar</h2>
            <form id="formTambahStok">
                <div class="form-group">
                    <label>Kode Lokasi</label>
                    <input type="text" id="kodeLokasi" required>
                </div>
                <div class="form-group">
                    <label>Kode Barang</label>
                    <input type="text" id="kodeBarang" required>
                </div>
                <div class="form-group">
                    <label>Nama Barang</label>
                    <input type="text" id="namaBarang" required>
                </div>
                <div class="form-group">
                    <label>Jenis Barang</label>
                    <input type="text" id="jenisBarang" value="BMP" required>
                </div>
                <div class="form-group">
                    <label>Edisi</label>
                    <input type="text" id="edisi" required>
                </div>
                <div class="form-group">
                    <label>Jumlah Stok</label>
                    <input type="number" id="stok" required>
                </div>
                <button type="submit">Tambah Bahan Ajar</button>
            </form>
        </div>

        <div class="card">
            <h2>Daftar Stok Bahan Ajar</h2>
            <div id="stokGrid" class="grid-container"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
